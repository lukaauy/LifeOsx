<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>LIFE OS</title><meta name="theme-color" content="#151516"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#151516;--sf:#1d1d1f;--sf2:#252528;--bd:#2f2f33;--tx:#ececee;--mu:#8e8e96;--ac:#9a8cf2;--acs:#9a8cf222;--ok:#6fbf9a;--wa:#e0a458;--er:#e07a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f4f4f5;--sf:#fff;--sf2:#f0f0f2;--bd:#e2e2e6;--tx:#1c1c1f;--mu:#70707a;--ac:#6b5bd6;--acs:#6b5bd61a;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Inter","Roboto",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#view{overscroll-behavior:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:18px;height:18px;stroke-width:1.7;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:flex;height:100%}
.side{width:224px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;display:flex;flex-direction:column;gap:2px;transition:width .2s;overflow-y:auto}
.side.min{width:62px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:600;letter-spacing:.02em}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:grid;place-items:center;color:var(--bg);font-style:normal;font-size:12px;font-weight:700;flex:none}
.min .lb,.min .logo b{display:none}
.nv{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;color:var(--mu);text-align:left;width:100%;transition:background .15s,color .15s}
.nv:hover{background:var(--sf2);color:var(--tx)}
.nv.on{background:var(--acs);color:var(--ac)}
.sp{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--bd)}
.srch{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 12px;color:var(--mu)}
.srch input{flex:1;background:none;border:0;padding:8px 0;outline:0;color:var(--tx);min-width:0}
.dt{color:var(--mu);margin-left:auto;font-size:13px;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);display:grid;place-items:center;font-weight:600;font-size:13px}
.ib{padding:7px;border-radius:9px;color:var(--mu)}.ib:hover{background:var(--sf2);color:var(--tx)}
#view{flex:1;overflow-y:auto;padding:28px 24px 40px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600}
.sub{color:var(--mu);margin-top:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);transition:background .15s}
.btn:hover{background:var(--sf2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.btn.d{color:var(--er)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.c>h2{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.c>h2 svg{color:var(--mu);width:16px;height:16px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.hero{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--bd);transition:transform .15s;touch-action:pan-y}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.dn .t{text-decoration:line-through;color:var(--mu)}
.ck{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--mu);display:grid;place-items:center;flex:none;transition:.15s}
.ck svg{width:12px;height:12px;stroke-width:3;opacity:0;color:var(--bg)}
.dn .ck,.hb.on .ck{background:var(--ok);border-color:var(--ok)}
.dn .ck svg,.hb.on .ck svg{opacity:1}
.pr{width:7px;height:7px;border-radius:50%;flex:none}
.sm{font-size:13px;color:var(--mu)}
.x{opacity:.5;padding:3px}.x:hover{opacity:1;color:var(--er)}
.hb{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;border-top:1px solid var(--bd);text-align:left}
.hb:first-of-type{border-top:0}
.em{color:var(--mu);font-size:13px;padding:6px 0}
.num{font-size:22px;font-weight:600;letter-spacing:-.01em}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu)}
.ph{max-width:460px;margin:12vh auto;text-align:center;color:var(--mu)}
.ph svg{width:34px;height:34px;color:var(--ac);margin-bottom:12px}
.ph h1{color:var(--tx);margin-bottom:6px}
.bnav{display:none}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:420px;animation:pop .15s}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.md h2{font-size:16px;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--sf2);padding:3px;border-radius:10px;margin-bottom:14px}
.tabs button{flex:1;padding:6px;border-radius:8px;color:var(--mu)}
.tabs .on{background:var(--sf);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;outline:0}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--ac)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
.lk{text-align:left;font:inherit;color:inherit;min-height:24px}
.seg{display:flex;gap:4px;background:var(--sf);border:1px solid var(--bd);padding:3px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;color:var(--mu)}.seg .on{background:var(--acs);color:var(--ac)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mx .c{padding:12px;min-height:130px}.mx h2{font-size:13px}
.mx button.lk{display:block;width:100%;padding:8px 0;font-size:14px;border-top:1px solid var(--bd);overflow-wrap:anywhere}
.bar{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.hm{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:3px;margin:12px 0}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--sf2)}.hm .a{background:var(--ac)}.hm .s{background:var(--mu);opacity:.5}.hm .f{background:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal .on{background:var(--ac);color:var(--bg)}.cal .td{box-shadow:inset 0 0 0 1.5px var(--ac)}
.dots{display:flex;gap:2px;height:4px}.dots b{width:4px;height:4px;border-radius:50%;background:var(--ac)}.on .dots b{background:var(--bg)}
.it{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--sf2);margin:4px 0;border-left:3px solid var(--ac);min-height:44px;align-items:center}.it.tk{border-left-color:var(--mu)}
.hr{display:flex;gap:10px;border-top:1px solid var(--bd);min-height:48px;padding:4px 0}.hr>span{width:44px;flex:none}.hr>div{flex:1;min-width:0}
.row .f{min-width:0;flex:1}
.tm{font-variant-numeric:tabular-nums;font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.fm{position:fixed;inset:0;background:var(--bg);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}.fm .tm{font-size:min(24vw,120px)}
.wrap>.c,.wrap>.mx{margin-bottom:12px}.wrap>.qa{margin-top:4px}
.fab,.hint{display:none}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:80px;background:var(--sf2);border-radius:14px;font-size:12px;padding:8px 2px}
.mi svg{color:var(--ac)}
input.f,select.f,textarea.f{font-size:16px;min-height:48px}
@media(hover:none){.hint{display:block;margin-top:8px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(max-width:1023px){
.side{display:none}header{padding:10px 14px}.dt{display:none}
#view{padding:18px 14px 110px}.s4,.s5,.s7,.s8{grid-column:span 12}.grid{gap:12px}
.top .qa{display:none}.top{margin-bottom:16px}h1{font-size:26px}
.c{padding:16px;border-radius:18px}.row,.hb{min-height:52px}.row{padding:11px 0}
.ck{width:26px;height:26px;border-radius:8px}.x,.ib{padding:11px}.av{width:42px;height:42px}
.srch input{font-size:16px;padding:11px 0}.btn{min-height:48px;padding:10px 16px}.tabs button{min-height:44px}
.bnav{display:flex;border-top:1px solid var(--bd);background:var(--sf);padding:6px 6px 4px}
.bnav .nv{flex-direction:column;gap:3px;flex:1;width:auto;font-size:11px;padding:6px 2px;border-radius:12px;min-height:56px;justify-content:center}
.fab{display:grid;position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--ac);color:var(--bg);place-items:center;z-index:5;box-shadow:0 6px 20px #0006}
.fab svg{width:26px;height:26px;stroke-width:2.2}
#modal{align-items:flex-end;padding:0}
.md{max-width:none;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .2s}
#toast{bottom:150px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
<script>
/* ===== Datos y persistencia (localStorage; migrable a IndexedDB en etapa 5) ===== */
const KEY='lifeos.v1',TZ='America/Montevideo';
const blank=()=>({s:{name:'Lucas',theme:'dark',min:false,demo:false},tasks:[],habits:[],tx:[],notes:[],events:[],goals:[],workouts:[],routines:[],subjects:[],study:[],pomos:[]});
/* Capa de almacenamiento: en Capacitor se cambia por Preferences/SQLite sin tocar el resto */
const Store={get:()=>localStorage.getItem(KEY),set:v=>localStorage.setItem(KEY,v)};
let D=null;try{D=JSON.parse(Store.get())}catch(e){}
const isNew=!D;D=D?{...blank(),...D,s:{...blank().s,...D.s}}:blank();
const save=()=>{try{Store.set(JSON.stringify(D))}catch(e){toast('No se pudo guardar en este navegador')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
const key=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
const add=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return key(d)};
const fd=k=>k.split('-').reverse().join('/');
const uyu=n=>new Intl.NumberFormat('es-UY',{style:'currency',currency:'UYU',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=()=>key();
function seed(){
  const t=TODAY();
  D.tasks.push(
    {id:uid(),t:'Enviar CV a dos empresas',pri:'alta',due:t,done:false,demo:1,g:'g1demo'},
    {id:uid(),t:'Preparar clase del curso',pri:'media',due:t,done:false,demo:1},
    {id:uid(),t:'Revisar presupuesto del mes',pri:'baja',due:'',done:false,demo:1},
    {id:uid(),t:'Pagar factura de UTE',pri:'urgente',due:t,done:false,demo:1});
  const l=n=>Array.from({length:n},(_,i)=>add(t,-i-1));
  D.habits.push({id:uid(),n:'Entrenar',log:l(3),demo:1},{id:uid(),n:'Leer 20 minutos',log:l(5),demo:1},{id:uid(),n:'Tomar 2 L de agua',log:l(1),demo:1});
  D.tx.push({id:uid(),k:'in',amt:32000,cat:'Trabajo',d:t,desc:'Ingreso',demo:1},{id:uid(),k:'out',amt:6400,cat:'Alimentación',d:t,desc:'Supermercado',demo:1},{id:uid(),k:'out',amt:1800,cat:'Transporte',d:t,desc:'Combustible',demo:1});
  D.notes.push({id:uid(),t:'Ideas para el CV',x:'Destacar experiencia en forestación y construcción.',d:t,demo:1});
  D.events.push({id:uid(),t:'Entrevista de trabajo',d:add(t,1),h:'10:00',e:'11:00',demo:1});D.goals.push({id:'g1demo',n:'Conseguir empleo estable',desc:'',start:t,due:add(t,60),st:'activo',demo:1});D.routines.push({id:uid(),n:'Empuje',ex:[{n:'Press banca',g:'pecho',k:'fuerza'},{n:'Press militar',g:'hombros',k:'fuerza'},{n:'Fondos',g:'brazos',k:'fuerza'}],demo:1});D.subjects.push({id:uid(),n:'Inglés',topics:[{id:uid(),t:'Present perfect',done:true},{id:uid(),t:'Vocabulario de trabajo',done:false},{id:uid(),t:'Listening',done:false}],links:[],demo:1});D.s.demo=true;
}
if(isNew){seed();save()}
const streak=h=>{let k=TODAY(),n=0;for(let i=0;i<400;i++,k=add(k,-1)){if(h.log.includes(k))n++;else if((h.skip||[]).includes(k)||i===0)continue;else break}return n};

/* ===== Navegación ===== */
const NAV=[['inicio','Inicio','layout-dashboard',0],['tareas','Tareas','check-square',2],['habitos','Hábitos','repeat',2],['calendario','Calendario','calendar',2],['objetivos','Objetivos','target',2],['entrenos','Entrenamientos','dumbbell',3],['finanzas','Finanzas','wallet',4],['estudios','Estudios','graduation-cap',3],['notas','Notas','notebook-pen',4],['productividad','Productividad','timer',3],['estadisticas','Estadísticas','bar-chart-3',3],['config','Configuración','settings',0]];
const MAIN=['inicio','tareas','habitos','finanzas'];
const route=()=>NAV.find(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'inicio';
let Q='';
const ic=n=>`<i data-lucide="${n}"></i>`;
const PRI={urgente:'var(--er)',alta:'var(--wa)',media:'var(--ac)',baja:'var(--mu)'};
const PO={urgente:0,alta:1,media:2,baja:3};

/* ===== Vistas ===== */
function dashboard(){
  const t=TODAY(),H=+new Intl.DateTimeFormat('es',{timeZone:TZ,hour:'numeric',hour12:false}).format();
  const g=H<6?'Buenas noches':H<13?'Buenos días':H<20?'Buenas tardes':'Buenas noches';
  const dl=new Date().toLocaleDateString('es-UY',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});
  const rel=D.tasks.filter(x=>x.done?x.doneAt===t:(!x.due||x.due<=t));
  const hd=D.habits.filter(h=>h.log.includes(t)).length;
  const tot=rel.length+D.habits.length,dn=rel.filter(x=>x.done).length+hd,pc=tot?Math.round(dn/tot*100):0;
  const q=Q.toLowerCase();
  const pend=D.tasks.filter(x=>!x.done&&x.t.toLowerCase().includes(q)).sort((a,b)=>PO[a.pri]-PO[b.pri]||(a.due||'9').localeCompare(b.due||'9'));
  const m=t.slice(0,7),mt=D.tx.filter(x=>x.d.startsWith(m));
  const inc=mt.filter(x=>x.k==='in').reduce((a,x)=>a+x.amt,0),out=mt.filter(x=>x.k==='out').reduce((a,x)=>a+x.amt,0);
  const bal=D.tx.reduce((a,x)=>a+(x.k==='in'?x.amt:-x.amt),0);
  const row=x=>`<div class="row" data-tid="${x.id}"><button class="ck" data-a="tt" data-id="${x.id}" aria-label="Completar">${ic('check')}</button><span class="pr" style="background:${PRI[x.pri]}"></span><span class="t">${esc(x.t)}</span>${x.due?`<span class="sm">${x.due===t?'Hoy':fd(x.due)}</span>`:''}<button class="x" data-a="dt" data-id="${x.id}" aria-label="Eliminar">${ic('trash-2')}</button></div>`;
  const empty=(txt,st)=>`<p class="em">${txt}</p><span class="pill">${st}</span>`;
  return `<div class="wrap"><div class="top"><div><h1>${g}, ${esc(D.s.name)}</h1><p class="sub">${dl[0].toUpperCase()+dl.slice(1)} · ${fd(t)}</p></div>
  <div class="qa"><button class="btn p" data-a="quick" data-id="task">${ic('plus')}Tarea</button><button class="btn" data-a="quick" data-id="note">${ic('file-plus')}Nota</button><button class="btn" data-a="quick" data-id="exp">${ic('banknote')}Gasto</button></div></div>
  <div class="grid">
  <div class="c s5"><h2>${ic('sun')}Progreso de hoy</h2><div class="hero"><div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--sf2)" stroke-width="8"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="${276.5*(1-pc/100)}" style="transition:stroke-dashoffset .5s"/></svg><b>${tot?pc+'%':'—'}</b></div>
  <div><div class="num">${dn}<span class="sm"> / ${tot}</span></div><p class="sub">${tot?'tareas y hábitos de hoy':'Crea una tarea o un hábito para empezar'}</p><p class="sm" style="margin-top:6px">${D.tasks.filter(x=>x.done).length} tareas completadas en total</p></div></div></div>
  <div class="c s7"><h2>${ic('list-checks')}Tareas pendientes <span class="pill">${pend.length}</span></h2>${pend.length?pend.slice(0,7).map(row).join('')+'<p class="sm hint">Desliza → completar · ← eliminar</p>':`<p class="em">${Q?'Sin resultados para “'+esc(Q)+'”.':'Nada pendiente. Toca + para añadir una tarea.'}</p>`}</div>
  <div class="c s4"><h2>${ic('repeat')}Hábitos de hoy</h2>${D.habits.length?D.habits.map(h=>`<button class="hb ${h.log.includes(t)?'on':''}" data-a="th" data-id="${h.id}"><span class="ck">${ic('check')}</span><span style="flex:1">${esc(h.n)}</span><span class="sm">${streak(h)} d</span></button>`).join(''):`<p class="em">Aún no tienes hábitos.</p><button class="btn" data-a="quick" data-id="habit">${ic('plus')}Crear hábito</button>`}</div>
  <div class="c s4"><h2>${ic('wallet')}Finanzas del mes</h2><div class="num">${uyu(bal)}</div><p class="sm">Balance total</p><div class="fin" style="margin-top:12px;grid-template-columns:1fr 1fr"><div><div style="color:var(--ok)">${uyu(inc)}</div><span class="sm">Ingresos</span></div><div><div style="color:var(--er)">${uyu(out)}</div><span class="sm">Gastos</span></div></div></div>
  <div class="c s4"><h2>${ic('notebook-pen')}Notas recientes</h2>${D.notes.length?D.notes.slice(-3).reverse().map(n=>`<div class="row"><span class="t">${esc(n.t)}<br><span class="sm">${fd(n.d)}</span></span></div>`).join(''):'<p class="em">Sin notas todavía.</p>'}</div>

function calendario(){
  const items=k=>[...D.events.filter(e=>e.d===k).map(e=>({...e,ev:1})),...D.tasks.filter(x=>x.due===k&&!x.done).map(x=>({...x,h:'',tk:1}))].sort((a,b)=>(a.h||'').localeCompare(b.h||''));

  if(CV==='dia'){const l=items(CD);ti=lab(CD);b=`<div class="c">${l.filter(i=>!i.h).map(it).join('')}${Array.from({length:17},(_,i)=>{const h=String(i+6).padStart(2,'0');return `<div class="hr"><span class="sm">${h}:00</span><div>${l.filter(x=>(x.h||'').slice(0,2)===h).map(it).join('')}</div></div>`}).join('')}</div>`}

}
function estudios(){
  const sd=new Set(D.study.map(x=>x.d));let k=TODAY(),r=0;if(!sd.has(k))k=add(k,-1);while(sd.has(k)){r++;k=add(k,-1)}
  const tot=D.study.reduce((a,x)=>a+x.min,0),hm=m=>`${Math.floor(m/60)} h ${m%60} min`;
  return `<div class="wrap">${head('Estudios',`${hm(tot)} acumuladas · racha ${r} días`,`<button class="btn p" data-a="quick" data-id="subject">${ic('plus')}Materia</button>`)}`+(D.subjects.length?D.subjects.map(S=>{
    const m=D.study.filter(x=>x.sid===S.id).reduce((a,x)=>a+x.min,0),dn=S.topics.filter(x=>x.done).length,p=S.topics.length?Math.round(dn/S.topics.length*100):0,o=SX===S.id;
    return `<div class="c"><button class="lk" style="width:100%" data-a="sx" data-id="${S.id}"><div class="row" style="border:0;padding:0"><span class="t"><b>${esc(S.n)}</b><br><span class="sm">${hm(m)} · ${dn}/${S.topics.length} temas</span></span><b>${p}%</b></div></button><div class="bar"><i style="width:${p}%"></i></div>`+(o?S.topics.map(t=>`<div class="row ${t.done?'dn':''}"><button class="ck" data-a="tp" data-id="${S.id}:${t.id}" aria-label="Completar">${ic('check')}</button><span class="t">${esc(t.t)}</span><button class="x" data-a="tdel" data-id="${S.id}:${t.id}" aria-label="Quitar">${ic('x')}</button></div>`).join('')+S.links.map((l,i)=>`<div class="row"><a class="t" style="color:var(--ac)" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a><button class="x" data-a="ldel" data-id="${S.id}:${i}" aria-label="Quitar">${ic('x')}</button></div>`).join('')+`<div class="qa" style="margin-top:10px"><button class="btn p" data-a="addsess" data-id="${S.id}">Registrar sesión</button><button class="btn" data-a="addtopic" data-id="${S.id}">Tema</button><button class="btn" data-a="addlink" data-id="${S.id}">Enlace</button><button class="btn" data-a="sedit" data-id="${S.id}">Editar</button></div>`:'')+'</div>'}).join(''):'<div class="c"><p class="em">Aún no hay materias. Toca + para crear una.</p></div>')+'</div>';
}
/* Pomodoro: usa marcas de tiempo, así sigue exacto si Android suspende la pantalla */
const PD=()=>({f:25,b:5,l:15,n:4,...(D.s.pomo||{})}),PM=()=>({foco:PD().f,desc:PD().b,largo:PD().l})[PT.m];
let PT={m:'foco',run:false,end:0,left:PD().f*60000,c:0};
const tl=()=>PT.run?Math.max(0,PT.end-Date.now()):PT.left,mmss=ms=>{const q=Math.ceil(ms/1000);return String(Math.floor(q/60)).padStart(2,'0')+':'+String(q%60).padStart(2,'0')};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.35)}catch(e){}}
function pdone(){PT.run=false;if(PT.m==='foco'){D.pomos.push({id:uid(),d:TODAY(),min:PD().f});PT.c++;PT.m=PT.c%PD().n===0?'largo':'desc'}else PT.m='foco';PT.left=PM()*60000;save();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();toast('Intervalo terminado');shell()}
setInterval(()=>{if(PT.run&&tl()<=0)pdone();document.querySelectorAll('.tm').forEach(e=>e.textContent=mmss(tl()))},500);
const MN={foco:'Foco',desc:'Descanso',largo:'Descanso largo'};
function FMH(){return `<div class="fm"><span class="sm">${MN[PT.m]}</span><div class="tm">${mmss(tl())}</div><div class="qa"><button class="btn p" data-a="ps">${PT.run?'Pausar':'Iniciar'}</button><button class="btn" data-a="pf">Salir</button></div></div>`}
function productividad(){
  const t=TODAY(),hoy=D.pomos.filter(p=>p.d===t);
  return `<div class="wrap">${head('Productividad',`${hoy.length} focos hoy · ${hoy.reduce((a,p)=>a+p.min,0)} min productivos`,'')}<div class="c" style="text-align:center"><span class="pill">${MN[PT.m]}</span><div class="tm" style="margin:10px 0">${mmss(tl())}</div><div class="qa" style="justify-content:center"><button class="btn p" data-a="ps">${PT.run?'Pausar':'Iniciar'}</button><button class="btn" data-a="pr">Reiniciar</button><button class="btn" data-a="pskip">Saltar</button></div><div class="qa" style="justify-content:center;margin-top:8px"><button class="btn" data-a="pf">${ic('maximize')}Concentración</button><button class="btn" data-a="pcfg">${ic('settings')}Ajustes</button></div></div><div class="c"><h2>Historial reciente</h2>${D.pomos.length?[...D.pomos].reverse().slice(0,8).map(p=>`<div class="row"><span class="t">Foco de ${p.min} min</span><span class="sm">${fd(p.d).slice(0,5)}</span></div>`).join(''):'<p class="em">Aún no hay sesiones de enfoque.</p>'}</div></div>`;
}
function estadisticas(){
  const t=TODAY(),ds=Array.from({length:7},(_,i)=>add(t,i-6)),sm=(a,f,g)=>ds.map(d=>a.filter(x=>f(x,d)).reduce((n,x)=>n+g(x),0));
  const M=[['Tareas completadas',sm(D.tasks,(x,d)=>x.done&&x.doneAt===d,()=>1),''],['Hábitos cumplidos',sm(D.habits,(h,d)=>h.log.includes(d),()=>1),''],['Estudio',sm(D.study,(x,d)=>x.d===d,x=>x.min),' min'],['Enfoque',sm(D.pomos,(x,d)=>x.d===d,x=>x.min),' min'],['Entrenamientos',sm(D.workouts,(x,d)=>x.d===d,()=>1),''],['Gastos',sm(D.tx,(x,d)=>x.k==='out'&&x.d===d,x=>x.amt),' UYU']];
  const L=ds.map(d=>new Date(d+'T12:00').toLocaleDateString('es-UY',{weekday:'narrow'}).toUpperCase());
  return `<div class="wrap">${head('Estadísticas','Últimos 7 días, calculado con tus datos reales','')}<div class="grid">`+M.map(([n,v,u])=>{const T=v.reduce((a,b)=>a+b,0),mx=Math.max(1,...v);return `<div class="c s4"><h2>${n}</h2><div class="num">${T.toLocaleString('es-UY')}<span class="sm">${u}</span></div>${T?`<svg viewBox="0 0 140 44" preserveAspectRatio="none" style="width:100%;height:64px;margin-top:6px">${v.map((y,i)=>`<rect x="${i*20+3}" y="${42-y/mx*38}" width="14" height="${Math.max(y/mx*38,y?2:0)}" rx="3" fill="var(--ac)" opacity="${i===6?1:.55}"/>`).join('')}</svg><div class="cal sm">${L.map(x=>`<span>${x}</span>`).join('')}</div>`:'<p class="em">Sin datos esta semana.</p>'}</div>`}).join('')+'</div></div>';
}
/* ===== Render ===== */
function shell(){
  const r=route(),item=n=>`<button class="nv ${n[0]===r?'on':''}" data-a="nav" data-id="${n[0]}" title="${n[1]}">${ic(n[2])}<span class="lb">${n[1]}</span></button>`;
  document.documentElement.dataset.theme=D.s.theme;
  document.getElementById('app').innerHTML=`<aside class="side ${D.s.min?'min':''}"><div class="logo"><i>L</i><b>LIFE OS</b></div>${NAV.slice(0,-1).map(item).join('')}<div class="sp"></div>${item(NAV[11])}<button class="nv" data-a="collapse" title="Contraer">${ic(D.s.min?'panel-left-open':'panel-left-close')}<span class="lb">Contraer</span></button></aside>
  <div class="main"><header><div class="srch">${ic('search')}<input id="q" placeholder="Buscar tareas…" value="${esc(Q)}" data-a-in="search"></div><span class="dt">${fd(TODAY())}</span><button class="ib" data-a="theme" data-id="${D.s.theme==='dark'?'light':'dark'}" aria-label="Cambiar tema">${ic(D.s.theme==='dark'?'sun':'moon')}</button><button class="av" data-a="nav" data-id="config" aria-label="Perfil">${esc(D.s.name[0]||'L').toUpperCase()}</button></header><main id="view"></main><nav class="bnav">${MAIN.map(i=>item(NAV.find(n=>n[0]===i))).join('')}<button class="nv ${MAIN.includes(r)?'':'on'}" data-a="more">${ic('layout-grid')}<span class="lb">Más</span></button></nav><button class="fab" data-a="quick" data-id="${({calendario:'event',objetivos:'goal',habitos:'habit',entrenos:D.s.ws?'ex':'startw',estudios:'subject'})[r]||'task'}" aria-label="Crear" style="${['productividad','estadisticas'].includes(r)?'display:none':''}">${ic('plus')}</button>${FM?FMH():''}</div>`;
  view();
}
function view(){const r=route();document.getElementById('view').innerHTML=({inicio:dashboard,config,tareas,habitos,calendario,objetivos,entrenos,estudios,productividad,estadisticas}[r]||(()=>stub(r)))();if(window.lucide)lucide.createIcons()}

/* ===== UI: modal, toast, confirmación ===== */
const md=document.getElementById('modal');
const closeM=()=>md.classList.remove('on');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function ask(msg,ok,label='Eliminar'){md.innerHTML=`<div class="md"><h2>${msg}</h2><div class="acts"><button class="btn" data-a="close">Cancelar</button><button class="btn p" id="yes">${label}</button></div></div>`;md.classList.add('on');document.getElementById('yes').onclick=()=>{closeM();ok()}}
function quick(type,xid){const X=xid?(({task:D.tasks,event:D.events,goal:D.goals,routine:D.routines,subject:D.subjects,workout:D.workouts})[type]||[]).find(a=>a.id===xid)||{}:{};
  const T=[['task','Tarea'],['note','Nota'],['exp','Gasto'],['habit','Hábito']];
  const f={task:tform(X),
  note:`<label>Título</label><input class="f" name="t" required autofocus><label>Contenido</label><textarea class="f" name="x" rows="4"></textarea>`,
  exp:`<label>Tipo</label><select class="f" name="k"><option value="out">Gasto</option><option value="in">Ingreso</option></select><label>Monto (UYU)</label><input class="f" type="number" inputmode="decimal" name="amt" min="1" step="any" required autofocus><label>Categoría</label><input class="f" name="cat" value="General"><label>Descripción</label><input class="f" name="desc">`,
  habit:`<label>Nombre del hábito</label><input class="f" name="n" required autofocus autocomplete="off">`,
  event:`<label>Título</label><input class="f" name="t" required autofocus autocomplete="off" value="${esc(X.t||'')}"><label>Fecha</label><input class="f" type="date" name="d" required value="${X.d||CD}"><label>Inicio</label><input class="f" type="time" name="h" value="${X.h||''}"><label>Fin</label><input class="f" type="time" name="e" value="${X.e||''}">`,
  goal:`<label>Nombre</label><input class="f" name="n" required autofocus autocomplete="off" value="${esc(X.n||'')}"><label>Descripción</label><textarea class="f" name="desc" rows="2">${esc(X.desc||'')}</textarea><label>Inicio</label><input class="f" type="date" name="start" value="${X.start||TODAY()}"><label>Fecha límite</label><input class="f" type="date" name="due" value="${X.due||''}"><label>Estado</label><select class="f" name="st">${['activo','pausado','logrado'].map(o=>`<option ${o===(X.st||'activo')?'selected':''}>${o}</option>`).join('')}</select>`};
  md.innerHTML=`<div class="md">${['task','note','exp','habit'].includes(type)&&!xid?`<div class="tabs">${T.map(x=>`<button type="button" class="${x[0]===type?'on':''}" data-a="quick" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>`:`<h2>${TT[type]||(xid?'Editar':'Nuevo')+' '+({task:'tarea',event:'evento',goal:'objetivo'})[type]}</h2>`}<form data-type="${type}" data-x="${xid||''}">${f[type]||(FX[type]&&FX[type](X))}<div class="acts">${xid?`<button type="button" class="btn d" data-a="del" data-id="${type}:${xid}" style="margin-right:auto">Eliminar</button>`:''}<button type="button" class="btn" data-a="close">Cancelar</button><button class="btn p">Guardar</button></div></form></div>`;md.classList.add('on');
  setTimeout(()=>md.querySelector('input,textarea')?.focus(),30);
}
md.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),ty=f.dataset.type;
  const xid=f.dataset.x,up=(a,o)=>{const i=xid?a.findIndex(z=>z.id===xid):-1;i>=0?Object.assign(a[i],o):a.push({id:uid(),...o})};
  if(ty==='task')up(D.tasks,{t:v.t.trim(),pri:v.pri,due:v.due,st:v.st,done:v.st==='completada',doneAt:v.st==='completada'?TODAY():null,g:v.g,tags:v.tags,rep:v.rep});
  if(ty==='event')up(D.events,{t:v.t.trim(),d:v.d,h:v.h,e:v.e});
  if(ty==='routine')up(D.routines,{n:v.n.trim(),ex:v.lines.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[n,g]=l.split(','),gg=(g||'general').trim().toLowerCase();return{n:n.trim(),g:gg,k:gg==='cardio'?'cardio':'fuerza'}})});
  if(ty==='subject')up(D.subjects,xid?{n:v.n.trim()}:{n:v.n.trim(),topics:[],links:[]});
  if(ty==='topic')D.subjects.find(x=>x.id===PX).topics.push({id:uid(),t:v.t.trim(),done:false});
  if(ty==='sess')D.study.push({id:uid(),sid:v.sid,d:v.d||TODAY(),min:+v.min});
  if(ty==='link'){const u=v.u.trim();D.subjects.find(x=>x.id===PX).links.push({u:/^https?:\/\//i.test(u)?u:'https://'+u,t:(v.t||u).trim()})}
  if(ty==='pomo'){D.s.pomo={f:+v.f||25,b:+v.b||5,l:+v.l||15,n:+v.n||4};if(!PT.run)PT.left=PM()*60000}
  if(ty==='startw'){const r=D.routines.find(x=>x.id===v.r);D.s.ws={n:v.n.trim()||(r?r.n:'Entrenamiento'),ex:r?r.ex.map(e=>({...e,sets:[]})):[]}}
  if(ty==='ex')D.s.ws.ex.push({n:v.n.trim(),g:v.g,k:v.k,sets:[]});
  if(ty==='goal')up(D.goals,{n:v.n.trim(),desc:v.desc,start:v.start,due:v.due,st:v.st});
  if(ty==='note')D.notes.push({id:uid(),t:v.t.trim(),x:v.x,d:TODAY()});
  if(ty==='exp')D.tx.push({id:uid(),k:v.k,amt:+v.amt,cat:v.cat||'General',d:TODAY(),desc:v.desc});
  if(ty==='habit')D.habits.push({id:uid(),n:v.n.trim(),log:[],c:TODAY()});
  save();closeM();view();toast('Guardado')});
md.addEventListener('click',e=>{if(e.target===md)closeM()});

/* ===== Acciones ===== */
const A={
  nav:id=>{location.hash=id},
  collapse:()=>{D.s.min=!D.s.min;save();shell()},
  theme:id=>{D.s.theme=id;save();shell()},
  close:closeM,quick:(id)=>quick(id),
  more:()=>{md.innerHTML=`<div class="md"><h2>Módulos</h2><div class="mg">${NAV.map(n=>`<button class="mi" data-a="go" data-id="${n[0]}">${ic(n[2])}<span>${n[1]}</span></button>`).join('')}</div></div>`;md.classList.add('on');window.lucide&&lucide.createIcons()},
  go:id=>{closeM();location.hash=id},
  tedit:id=>quick('task',id),eedit:id=>quick('event',id),gedit:id=>quick('goal',id),
  del:id=>{const[t,i]=id.split(':'),k={task:'tasks',event:'events',goal:'goals',routine:'routines',subject:'subjects',workout:'workouts'}[t];ask('¿Eliminar este elemento?',()=>{D[k]=D[k].filter(a=>a.id!==i);save();view();toast('Eliminado')})},
  tv:id=>{TV=id;view()},cv:id=>{CV=id;view()},cday:id=>{CD=id;view()},ctoday:()=>{CD=TODAY();view()},
  cnav:id=>{const n=+id;if(CV==='mes'){const d=new Date(CD+'T12:00');d.setDate(1);d.setMonth(d.getMonth()+n);CD=key(d)}else CD=add(CD,n*(CV==='dia'?1:7));view()},
  mv:id=>{const x=D.tasks.find(t=>t.id===id),q=stOf(x);if(q==='pendiente'){x.st='progreso';save();view()}else if(q==='progreso')A.tt(id);else{x.done=false;x.st='pendiente';save();view()}},
  wstart:()=>quick('startw'),exadd:()=>quick('ex'),
  setadd:id=>{const i=+id,e=D.s.ws.ex[i],v=n=>+(document.getElementById('s'+i+n)||{}).value||0,x=e.k==='cardio'?{min:v('a')}:{reps:v('a'),kg:v('b'),rest:v('c')};if(!(x.min||x.reps))return toast('Indica repeticiones o minutos');e.sets.push(x);vib();save();view()},
  setdel:id=>{const[i,j]=id.split(':');D.s.ws.ex[i].sets.splice(j,1);save();view()},
  wfin:()=>{const w=D.s.ws;if(!w.ex.some(e=>e.sets.length))return toast('Registra al menos una serie');D.workouts.push({id:uid(),d:TODAY(),n:w.n,ex:w.ex.filter(e=>e.sets.length)});D.s.ws=null;save();view();toast('Sesión guardada')},
  wdis:()=>ask('¿Descartar la sesión en curso?',()=>{D.s.ws=null;save();view()},'Descartar'),
  te:id=>{TE=id;view()},redit:id=>quick('routine',id),wopen:id=>quick('workout',id),sx:id=>{SX=SX===id?null:id;view()},sedit:id=>quick('subject',id),
  tp:id=>{const[a,b]=id.split(':'),k=D.subjects.find(x=>x.id===a).topics.find(x=>x.id===b);k.done=!k.done;vib();save();view()},
  tdel:id=>{const[a,b]=id.split(':'),S=D.subjects.find(x=>x.id===a);S.topics=S.topics.filter(x=>x.id!==b);save();view()},
  addtopic:id=>{PX=id;quick('topic')},addsess:id=>{PX=id;quick('sess')},addlink:id=>{PX=id;quick('link')},
  ldel:id=>{const[a,b]=id.split(':');D.subjects.find(x=>x.id===a).links.splice(b,1);save();view()},
  ps:()=>{if(PT.run){PT.left=tl();PT.run=false}else{PT.end=Date.now()+PT.left;PT.run=true;try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}shell()},
  pr:()=>{PT.run=false;PT.left=PM()*60000;shell()},
  pskip:()=>{PT.run=false;PT.m=PT.m==='foco'?'desc':'foco';PT.left=PM()*60000;shell()},
  pf:()=>{FM=!FM;shell()},pcfg:()=>quick('pomo'),
  hx:id=>{HX=HX===id?null:id;view()},
  hskip:id=>{const h=D.habits.find(x=>x.id===id),t=TODAY();h.skip=(h.skip||[]).includes(t)?h.skip.filter(d=>d!==t):[...(h.skip||[]),t];save();view()},
  hdel:id=>ask('¿Eliminar este hábito y su historial?',()=>{D.habits=D.habits.filter(h=>h.id!==id);save();view();toast('Hábito eliminado')}),
  tt:id=>{const x=D.tasks.find(t=>t.id===id);x.done=!x.done;x.doneAt=x.done?TODAY():null;if(x.done&&x.rep&&!x.nx){x.nx=1;D.tasks.push({...x,id:uid(),done:false,doneAt:null,nx:0,st:'pendiente',due:add(x.due||TODAY(),x.rep==='d'?1:7)})}vib();save();view()},
  dt:id=>ask('¿Eliminar esta tarea?',()=>{D.tasks=D.tasks.filter(t=>t.id!==id);save();view();toast('Tarea eliminada')}),
  th:id=>{const h=D.habits.find(x=>x.id===id),t=TODAY();h.log=h.log.includes(t)?h.log.filter(d=>d!==t):[...h.log,t];vib();save();view()},
  demoOn:()=>{seed();save();view()},
  demoOff:()=>ask('¿Eliminar los datos de demostración?',()=>{for(const k of['tasks','habits','tx','notes','events','goals','routines','subjects'])D[k]=D[k].filter(x=>!x.demo);D.s.demo=false;save();view();toast('Demo eliminada')}),
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download=`life-os-${TODAY()}.json`;a.click();toast('Copia exportada')},
  reset:()=>ask('Se borrarán todos tus datos de este dispositivo. ¿Continuar?',()=>{D=blank();save();shell();toast('Datos borrados')},'Borrar todo')
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id)});
document.addEventListener('input',e=>{const a=e.target.dataset.aIn;
  if(a==='search'){Q=e.target.value;if(route()!=='inicio')location.hash='inicio';else view()}
  if(a==='name'){D.s.name=e.target.value||'Lucas';save()}});
document.addEventListener('change',e=>{if(e.target.dataset.aIn!=='import')return;const fl=e.target.files[0];if(!fl)return;
  fl.text().then(s=>{const j=JSON.parse(s);if(!j.s||!Array.isArray(j.tasks))throw 0;D=Object.assign(blank(),j);save();shell();toast('Copia importada')}).catch(()=>toast('Archivo no válido'))});
addEventListener('hashchange',shell);
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
let sx=0,sy=0,sr=null;
document.addEventListener('touchstart',e=>{sr=e.target.closest('.row[data-tid]');if(sr){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchmove',e=>{if(!sr)return;const dx=e.touches[0].clientX-sx;if(Math.abs(dx)>Math.abs(e.touches[0].clientY-sy))sr.style.transform=`translateX(${Math.max(-90,Math.min(90,dx))}px)`},{passive:true});
document.addEventListener('touchend',e=>{if(!sr)return;const dx=e.changedTouches[0].clientX-sx,id=sr.dataset.tid;sr.style.transform='';sr=null;if(dx>80)A.tt(id);else if(dx<-80)A.dt(id)},{passive:true});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
shell();
</script></body></html>
